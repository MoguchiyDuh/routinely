{% extends "auth_base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-card">
<div class="brand-mark"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#repeat"/></svg></div>
<h1>Log in</h1>
<p class="tagline">Routines, proof, and friendly accountability.</p>
{% match error %}
{% when Some with (message) %}
<p class="form-error" role="alert">{{ message }}</p>
{% when None %}
{% endmatch %}
<form method="post" action="/login">
<div class="field">
<label for="login-username">Username</label>
<input id="login-username" name="username" autocomplete="username" autofocus required{% if !username.is_empty() %} value="{{ username }}"{% endif %}>
</div>
<div class="field">
<label for="login-password">Password</label>
<input id="login-password" type="password" name="password" autocomplete="current-password" required>
</div>
<input type="hidden" name="timezone">
<button type="submit">Log in</button>
</form>
<p class="auth-alt">No account? <a href="/signup">Create one</a></p>
</div>
{% endblock %}
