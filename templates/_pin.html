<div id="pin-occ-{{ occurrence_id }}" class="pin">
<p>{{ pin.summary }}</p>
{% if let Some(n) = pin.notes %}
<p class="pin-notes">{{ crate::web::linkify(n)|safe }}</p>
{% endif %}
{% if !pin.links.is_empty() %}
<ul>
{% for link in pin.links %}
<li><a href="{{ link }}" target="_blank" rel="noopener noreferrer">{{ link }}</a></li>
{% endfor %}
</ul>
{% endif %}
{% if !pin.photos.is_empty() %}
<div class="pin-photos">
{% for photo in pin.photos %}
<a href="{{ photo }}" target="_blank" rel="noopener noreferrer"><img src="{{ photo }}" alt="Proof photo"></a>
{% endfor %}
</div>
{% endif %}
</div>
