{% extends "auth_base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<div class="auth-card error-card" role="alert">
<div class="brand-mark"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg?v={{ crate::ASSET_VERSION }}#circle-alert"/></svg></div>
<h1>{{ heading }}</h1>
<p class="error-message">{{ message }}</p>
<div class="error-actions">
{% if let Some(href) = back %}<a class="btn btn-primary" href="{{ href }}">Go back</a>{% endif %}
<a class="btn btn-secondary" href="/day">Today</a>
</div>
</div>
{% endblock %}
