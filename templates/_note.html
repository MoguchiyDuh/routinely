<form id="note" class="card note-card" method="post" action="/notes/{{ date }}" aria-label="Daily note">
<div class="card-header">
<h2>Note</h2>
{% if saved %}
<span class="save-state" role="status">Saved</span>
{% endif %}
</div>
<textarea name="body" class="note-textarea" aria-label="Daily note" hx-post="/notes/{{ date }}" hx-trigger="input changed delay:800ms, blur" hx-target="#note" hx-swap="outerHTML" hx-preserve="true">{% if let Some(text) = body %}{{ text }}{% endif %}</textarea>
<div class="note-actions">
<button type="submit" class="btn btn-secondary btn-sm" hx-post="/notes/{{ date }}" hx-target="#note" hx-swap="outerHTML">Save note</button>
</div>
</form>
