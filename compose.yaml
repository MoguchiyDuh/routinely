name: routinely

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks:
      - frontend
    depends_on:
      - app

  app:
    build: .
    image: routinely:latest
    restart: unless-stopped
    environment:
      ROUTINELY_DATABASE_URL: postgres://routinely:${POSTGRES_PASSWORD}@db/routinely
      ROUTINELY_VALKEY_URL: redis://:${VALKEY_PASSWORD}@cache:6379
      ROUTINELY_SIGNUP_CODE: ${SIGNUP_CODE}
      ROUTINELY_COOKIE_SECURE: "true"
    volumes:
      - uploads:/app/data/uploads
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: routinely
      POSTGRES_DB: routinely
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "routinely"]
      interval: 5s
      retries: 10

  cache:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "valkey-cli", "--no-auth-warning", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 5s
      retries: 10

networks:
  frontend:
  backend:
    internal: true

volumes:
  pgdata:
  valkey-data:
  uploads:
  caddy-data:
